  /* 把截图模式接进启动流程 */
  function readShotParam() {
    var m = /(?:^|[?&#])shot=([a-z0-9_-]+)/i.exec(window.location.search + '&' + window.location.hash);
    return m ? m[1].toLowerCase() : null;
  }

  function hasParam(name) {
    return new RegExp('(?:^|[?&#])' + name + '(?:=|&|#|$)').test(window.location.search + '&' + window.location.hash);
  }

  /* ?selftest=1 → 跑结构自检 + 批量模拟，把 JSON 打进 DOM，
     供 node/Chrome headless 读取（不需要 puppeteer）。
     这是"自动化验收"的入口，与游戏本体共用同一份代码，不会漂移。 */
  function runSelfTestPage() {
    var out = { url: location.href };
    try {
      out.selfTest = window.__selfTest();
    } catch (e) {
      out.selfTest = { ok: false, problems: ['__selfTest 抛异常: ' + e.message] };
    }
    try {
      out.run = window.__autoplayRun();
    } catch (e2) {
      out.run = { error: e2.message };
    }
    try {
      out.sweep = window.__sweep();
    } catch (e3) {
      out.sweep = [{ error: e3.message }];
    }
    try {
      out.sweep2 = window.__sweep2({ runs: 20 });
    } catch (e6) {
      out.sweep2 = [{ error: e6.message }];
    }
    try {
      out.calibrate = window.__calibrate({ runs: 20 });
    } catch (e8) {
      out.calibrate = [{ error: e8.message }];
    }
    try {
      // 重点复测：负重惩罚到底有没有用？加大样本量压低噪声再判一次。
      out.carryTest = window.__calibrate({
        deep: [2.2], carry: [0, 0.02, 0.03, 0.05], back: [0.5, 1.0, 1.5, 2.2, 3.0], runs: 48
      });
    } catch (e9) {
      out.carryTest = [{ error: e9.message }];
    }

    /* --dump-dom 的输出长度有上限（约 130KB），超了会被截断成无效 JSON。
       所以自检结果要去掉样本明细，只留聚合值。 */
    function stripSamples(x) {
      if (Array.isArray(x)) return x.map(stripSamples);
      if (x && typeof x === 'object') {
        var o = {};
        for (var k in x) {
          if (k === 'samples') continue;
          o[k] = stripSamples(x[k]);
        }
        return o;
      }
      return x;
    }
    out = stripSamples(out);
    try {
      out.inputBurden = window.__inputBurden({ runs: 16 });
    } catch (e7) {
      out.inputBurden = { error: e7.message };
    }
    try {
      out.many = {
        safe: window.__runMany({ runs: 24, policy: { targetLayer: 3, turnBackAt: 2.6, minSlack: 8.0, grabRadius: 1.0 }, seed: 4000 }),
        balanced: window.__runMany({ runs: 24, policy: { targetLayer: 3, turnBackAt: 1.35, minSlack: 3.0, grabRadius: 1.0 }, seed: 4000 }),
        greedy: window.__runMany({ runs: 24, policy: { targetLayer: 3, turnBackAt: 0.30, minSlack: 0.4, grabRadius: 1.0 }, seed: 4000 })
      };
    } catch (e4) {
      out.many = { error: e4.message };
    }
    try {
      // free3d 对照：输入负担与收益的对比（R7 量化证据）
      window.__diveMode('topdown');
      var td = window.__runMany({ runs: 16, policy: DEFAULT_POLICY, seed: 7000 });
      window.__diveMode('free3d');
      var f3 = window.__runMany({ runs: 16, policy: DEFAULT_POLICY, seed: 7000 });
      window.__diveMode('topdown');
      out.modeCompare = { topdown: td, free3d: f3 };
    } catch (e5) {
      out.modeCompare = { error: e5.message };
    }

    var pre = document.createElement('pre');
    pre.id = 'selftest-out';
    pre.textContent = JSON.stringify(out, null, 1);
    pre.style.cssText = 'position:fixed;inset:0;overflow:auto;font:11px/1.4 monospace;color:#cfe;background:#02101a;margin:0;padding:10px;z-index:99';
    document.body.appendChild(pre);
    document.title = 'SELFTEST_' + (out.selfTest && out.selfTest.ok ? 'PASS' : 'FAIL');
  }

  /* ===========================================================================
   * 十三、自动化验收接口
   * ========================================================================== */

  /* 验收接口 1：__diveState() */
  window.__diveState = function () {
    var h = S.hero;
    var dangerShark = 0;
    for (var i = 0; i < S.sharks.length; i++) {
      var sh = S.sharks[i];
      if (sh.layer !== S.depth) continue;
      var d = Math.hypot(sh.x - h.x, sh.y - h.y);
      var lvl = sh.state === 'charge' ? 1 : (sh.state === 'alert' ? 0.85 : clamp(1 - d / sh.alertR, 0, 1) * 0.5);
      if (lvl > dangerShark) dangerShark = lvl;
    }
    var slack = S.oxygen - currentReserve();
    var dangerOxy = clamp(1 - slack / 14, 0, 1);
    var danger = Math.max(dangerShark, dangerOxy);

    return {
      // —— 验收要求的字段 ——
      phase: S.phase,
      oxygen: Math.round(S.oxygen * 100) / 100,
      oxygenMax: TUNE.oxygenMax,
      depth: S.depth,                       // 1浅/2中/3深，0=水面
      collected: S.bag.map(function (b) { return { name: b.name, value: b.value }; }),
      totalValue: S.bag.reduce(function (a, b) { return a + b.value; }, 0),
      danger: Math.round(danger * 100) / 100,

      // —— 额外诊断字段 ——
      depthName: S.depth === 0 ? '水面' : LAYERS[S.depth].name,
      depthMeters: S.depth === 0 ? 0 : (S.depth === 1 ? 8 : (S.depth === 2 ? 28 : 55)),
      reserve: Math.round(currentReserve() * 100) / 100,   // 回到水面需要多少氧气
      slack: Math.round(slack * 100) / 100,                // 还能贪多少
      banked: (S.phase === 'settled') ? (S.settle ? S.settle.banked : 0)
        : (S.phase === 'blackout' ? 0 : null),
      lost: !!S.lost,
      mode: S.mode,
      itemsLeft: S.items.length,
      elapsed: Math.round(S.elapsed * 10) / 10,
      stats: S.stats
    };
  };

  /* 验收接口 2：__autoplay()
   * 设计成"近 10Hz 调用一次即可推进一局"，同时单次调用也是安全的（幂等）。
   * 返回本步的动作，方便 log。 */
  window.__autoplay = function () {
    if (S.phase === 'title') { startRun(); return { action: 'start' }; }
    if (S.phase === 'settled' || S.phase === 'blackout') {
      var res = { action: 'restart' };
      startRun();
      return res;
    }
    if (S.phase !== 'diving') return { action: 'wait' };
    return aiDrive(1 / 10, DEFAULT_POLICY);
  };

  /* 主动玩一整局（同步跑完，供自动化一次拿到结果） */
  window.__autoplayRun = function (policy) {
    return headlessRun(policy || DEFAULT_POLICY, 1 / 60, (S.rand === Math.random) ? 12345 : 0);
  };

  var DEFAULT_POLICY = {
    targetLayer: 3,      // 目标深度层
    turnBackAt: 1.35,    // 余量 < turnBackAt × 单件成本 就撤
    minSlack: 3.0,
    grabRadius: 1.0
  };

  /* 一个"人类可用的"策略：只用摇杆 + 采集钮 + 上浮/下潜钮，
   * 与玩家手上的按钮完全一致 —— 这一点本身就是 R7 的证据：
   * 如果这条路走不通，任何玩家也走不通。 */
  function aiDrive(dt, policy) {
    if (S.phase !== 'diving') return { action: 'idle' };
    var h = S.hero;
    var p = policy || DEFAULT_POLICY;
    var target = p.targetLayer;

    // 1) 该撤了吗？
    var slack = S.oxygen - currentReserve();
    var est = estimatedItemCost();
    var needBack = Math.max(p.minSlack, est * p.turnBackAt);
    if (S.depth > target) { aiStick = { x: 0, y: 0, mag: 0 }; beginTransit(-1); return { action: 'ascend' }; }
    if (slack < needBack) { aiStick = { x: 0, y: 0, mag: 0 }; beginTransit(-1); return { action: 'ascend' }; }

    // 2) 该往下走了吗？（先确认到了目标层还回得来）
    if (S.depth < target) {
      var resAtTarget = reserveOxygen(target, S.bag.length + 1) + est * 2.2;
      if (S.oxygen > resAtTarget) {
        aiStick = { x: 0, y: 0, mag: 0 };
        beginTransit(1);
        return { action: 'descend' };
      }
    }

    // 3) 找最近的可采集物，游过去，进范围就抓
    var best = null, bestD = 1e9;
    for (var i = 0; i < S.items.length; i++) {
      var it = S.items[i];
      var d = Math.hypot(it.x - h.x, it.y - h.y);
      if (d < bestD) { bestD = d; best = it; }
    }
    if (best) {
      var dx = best.x - h.x, dy = best.y - h.y;
      var len = Math.hypot(dx, dy) || 1;
      aiStick = { x: dx / len, y: dy / len, mag: 1 };
      if (bestD <= (TUNE.grabRange + best.r) * p.grabRadius) {
        // free3d 对照：还要把"微深度"对上（第二个连续通道）
        if (S.mode === 'free3d') {
          var want = best.trim;
          var cur = S.hero.trim || 0;
          heldLayer.down = want > cur + 0.05;
          heldLayer.up = want < cur - 0.05;
        }
        if (tryGrab()) return { action: 'grab', name: best.name };
        return { action: 'align' };
      }
      return { action: 'move', target: best.name, dist: Math.round(bestD) };
    }

    // 4) 本层清空 → 上浮
    aiStick = { x: 0, y: 0, mag: 0 };
    beginTransit(-1);
    return { action: 'ascend' };
  }

  /* headless 整局模拟：固定步长，返回可复现的统计 */
  function headlessRun(policy, dt, seed) {
    var savedRand = S.rand;
    var savedMode = S.mode;
    S.rand = makeRng(seed || 987654321);
    startRun();
    var guard = 0;
    var maxSteps = 60 * 240;
    aiStick = null;
    while ((S.phase === 'diving' || S.phase === 'transit') && guard < maxSteps) {
      aiDrive(dt, policy);
      step(dt);
      guard++;
    }
    var st = S.settle || {
      lost: S.lost, bag: S.bag.slice(),
      total: S.bag.reduce(function (a, b) { return a + b.value; }, 0),
      elapsed: S.elapsed, stats: S.stats
    };
    var out = {
      lost: !!st.lost,
      total: st.total,
      banked: st.lost ? 0 : st.total,
      bagCount: st.bag.length,
      elapsed: Math.round(st.elapsed * 10) / 10,
      oxygenLeft: Math.round(S.oxygen * 10) / 10,
      maxDepth: st.stats ? st.stats.maxDepth : 0,
      sharkHits: st.stats ? st.stats.sharkHits : 0,
      hesitationSec: st.stats ? Math.round(st.stats.hesitationSec * 10) / 10 : 0,
      hesitationEpisodes: st.stats ? st.stats.hesitationEpisodes : 0,
      episodesWithTarget: st.stats ? st.stats.episodesWithTarget : 0,
      gambleGrab: st.stats ? st.stats.gambleGrab : 0,
      grabInHesitationBand: st.stats ? st.stats.grabInHesitationBand : 0,
      grabOxygenPct: st.stats ? st.stats.grabOxygenPct : [],
      nearMissSec: st.stats ? Math.round(st.stats.nearMissSec * 10) / 10 : 0,
      simFrames: st.stats ? {
        total: st.stats._framesTotal || 0,
        dual: st.stats.simultaneousInputFrames || 0
      } : { total: 0, dual: 0 },
      trimAlignFail: st.stats ? st.stats.trimAlignFail : 0,
      deathCause: st.stats ? st.stats.deathCause : null,
      grabs: st.stats ? st.stats.grabsByLayer : null,
      phase: S.phase
    };
    aiStick = null;            // 关键：headless 跑完必须清掉，否则会污染之后的真人输入
    heldLayer.up = false;
    heldLayer.down = false;
    S.mode = savedMode;
    S.rand = savedRand;
    return out;
  }

  /* 批量跑：用来算"贪婪玩家的死亡率"，这是判断氧气压力是否合适的客观指标 */
  window.__runMany = function (opts) {
    opts = opts || {};
    var runs = opts.runs || 30;
    var policy = opts.policy || DEFAULT_POLICY;
    var baseSeed = opts.seed || 1000;
    var list = [];
    for (var i = 0; i < runs; i++) list.push(headlessRun(policy, 1 / 60, baseSeed + i * 7919));
    var lost = 0, sum = 0, best = 0, hes = 0, gr = { 1: 0, 2: 0, 3: 0 };
    var episodes = 0, episodesWithTarget = 0, gambles = 0, lowOxygenGrabs = 0, allGrabs = 0;
    var causes = {}, grabInBand = 0;
    for (var j = 0; j < list.length; j++) {
      if (list[j].lost) lost++;
      sum += list[j].banked;
      if (list[j].banked > best) best = list[j].banked;
      hes += list[j].hesitationSec;
      episodes += list[j].hesitationEpisodes || 0;
      episodesWithTarget += list[j].episodesWithTarget || 0;
      gambles += list[j].gambleGrab || 0;
      grabInBand += list[j].grabInHesitationBand || 0;
      var dc = list[j].deathCause || {};
      for (var ck in dc) causes[ck] = (causes[ck] || 0) + dc[ck];
      // "低氧采集"= 氧气低于 40% 时仍在采集，是压力真实存在的证据
      var pcts = list[j].grabOxygenPct || [];
      allGrabs += pcts.length;
      for (var q = 0; q < pcts.length; q++) if (pcts[q] < 40) lowOxygenGrabs++;
      for (var d = 1; d <= 3; d++) gr[d] += list[j].grabs[d] || 0;
    }
    function r1(x) { return Math.round(x * 10) / 10; }
    return {
      runs: runs,
      policy: policy,
      deathRate: Math.round(lost / runs * 1000) / 10,          // %
      avgBanked: r1(sum / runs),
      bestBanked: best,
      avgHesitationSec: r1(hes / runs),
      avgEpisodes: r1(episodes / runs),                        // 每局"纠结段"数
      avgEpisodesWithTarget: r1(episodesWithTarget / runs),    // 其中手边有东西可捡的
      gamblesPerRun: r1(gambles / runs),
      grabInBandPerRun: r1(grabInBand / runs),
      deathCause: causes,                       // 每局赌博式采集次数
      lowOxygenGrabShare: allGrabs ? Math.round(lowOxygenGrabs / allGrabs * 100) : 0, // %
      avgGrabsByLayer: { 1: r1(gr[1] / runs), 2: r1(gr[2] / runs), 3: r1(gr[3] / runs) },
      samples: list.slice(0, 4)
    };
  };

  /* 参数扫描：给"调参过程"提供真实数据，不再靠我拍脑袋 */
  window.__sweep = function () {
    var out = [];
    var origDeep = TUNE.layerOxygenMult[3];
    var origCarry = TUNE.carryPenalty;
    var deepOpts = [1.6, 1.9, 2.2, 2.5];
    var carryOpts = [0, 0.05];
    var policies = {
      safe: { targetLayer: 3, turnBackAt: 2.6, minSlack: 8.0, grabRadius: 1.0 },
      balanced: { targetLayer: 3, turnBackAt: 1.35, minSlack: 3.0, grabRadius: 1.0 },
      greedy: { targetLayer: 3, turnBackAt: 0.30, minSlack: 0.4, grabRadius: 1.0 }
    };
    for (var a = 0; a < deepOpts.length; a++) {
      for (var b = 0; b < carryOpts.length; b++) {
        LAYERS[3].oxygenMult = deepOpts[a];
        TUNE.layerOxygenMult[3] = deepOpts[a];
        TUNE.carryPenalty = carryOpts[b];
        var row = { deepMult: deepOpts[a], carryPenalty: carryOpts[b] };
        for (var k in policies) {
          var r = window.__runMany({ runs: 20, policy: policies[k], seed: 4000 });
          row[k] = {
            death: r.deathRate, value: r.avgBanked, hes: r.avgHesitationSec,
            ep: r.avgEpisodesWithTarget, gamble: r.gamblesPerRun,
            lowOxy: r.lowOxygenGrabShare, grabs: r.avgGrabsByLayer
          };
        }
        out.push(row);
      }
    }
    LAYERS[3].oxygenMult = origDeep;
    TUNE.layerOxygenMult[3] = origDeep;
    TUNE.carryPenalty = origCarry;
    return out;
  };

  /* 参数扫描 2：找"风险—回报"曲线的形状。
   * 一个手感成立的风险机制，其期望收益曲线必须是**单峰**的：
   * 太保守 → 收益低；太贪婪 → 死亡率吃光收益；中间某个点最优。
   * 如果曲线单调（越贪越好或越稳越好），说明风险没有回报、或者没有风险，
   * 玩家就不会产生"犹豫"这种情绪——这正是要验的东西。 */
  window.__sweep2 = function (opts) {
    opts = opts || {};
    var deepOpts = opts.deep || [1.6, 2.2];
    var carryOpts = opts.carry || [0, 0.03, 0.05];
    var backOpts = [0.30, 0.8, 1.35, 2.0, 2.8];
    var out = [];
    var origDeep = TUNE.layerOxygenMult[3], origCarry = TUNE.carryPenalty;
    for (var a = 0; a < deepOpts.length; a++) {
      for (var b = 0; b < carryOpts.length; b++) {
        LAYERS[3].oxygenMult = deepOpts[a];
        TUNE.layerOxygenMult[3] = deepOpts[a];
        TUNE.carryPenalty = carryOpts[b];
        var cells = [];
        for (var c = 0; c < backOpts.length; c++) {
          var r = window.__runMany({
            runs: opts.runs || 24,
            policy: { targetLayer: 3, turnBackAt: backOpts[c], minSlack: Math.max(0.4, backOpts[c] * 2.0), grabRadius: 1.0 },
            seed: 4000
          });
          cells.push({
            back: backOpts[c],
            death: r.deathRate,
            value: r.avgBanked,
            ev: Math.round(r.avgBanked * (1 - r.deathRate / 100) * 10) / 10,
            ep: r.avgEpisodesWithTarget,
            lowOxy: r.lowOxygenGrabShare,
            deep: r.avgGrabsByLayer[3]
          });
        }
        // 找峰值：EV 最高的那一格，以及它是否在中间
        var bestI = 0;
        for (var q = 1; q < cells.length; q++) if (cells[q].ev > cells[bestI].ev) bestI = q;
        out.push({
          deepMult: deepOpts[a], carry: carryOpts[b],
          cells: cells,
          bestBack: cells[bestI].back,
          bestIsInterior: bestI > 0 && bestI < cells.length - 1,   // ★ 单峰判据
          bestEv: cells[bestI].ev
        });
      }
    }
    LAYERS[3].oxygenMult = origDeep;
    TUNE.layerOxygenMult[3] = origDeep;
    TUNE.carryPenalty = origCarry;
    return out;
  };

  /* 输入负担对比：R7 最直接的一组量化证据。
   * 同样的目标、同样的 AI 策略，只改变"是否必须维持第二个连续输入通道"。 */
  window.__inputBurden = function (opts) {
    opts = opts || {};
    var runs = opts.runs || 20;
    function measure(mode) {
      window.__diveMode(mode);
      var agg = { death: 0, value: 0, framesTotal: 0, framesDual: 0, alignFails: 0, episodes: 0 };
      for (var i = 0; i < runs; i++) {
        var r = headlessRun(DEFAULT_POLICY, 1 / 60, 9000 + i * 7919);
        if (r.lost) agg.death++;
        agg.value += r.banked;
        agg.episodes += r.episodesWithTarget || 0;
        agg.framesTotal += (r.simFrames && r.simFrames.total) || 0;
        agg.framesDual += (r.simFrames && r.simFrames.dual) || 0;
        agg.alignFails += r.trimAlignFail || 0;
      }
      window.__diveMode('topdown');
      return {
        mode: mode,
        deathRate: Math.round(agg.death / runs * 1000) / 10,
        avgBanked: Math.round(agg.value / runs * 10) / 10,
        avgEpisodesWithTarget: Math.round(agg.episodes / runs * 10) / 10,
        dualChannelShare: agg.framesTotal ? Math.round(agg.framesDual / agg.framesTotal * 100) : 0,
        alignFailsPerRun: Math.round(agg.alignFails / runs * 10) / 10
      };
    }
    var td = measure('topdown');
    var f3 = measure('free3d');
    return { topdown: td, free3d: f3 };
  };
  /* 最终校准：把"深水耗氧倍率 × 负重惩罚"和"撤退阈值"一起扫，
   * 输出每个组合的 EV 曲线、单峰性、犹豫事件数、低氧采集占比。
   * 这是"氧气调参过程"的原始数据来源。 */
  window.__calibrate = function (opts) {
    opts = opts || {};
    var deepOpts = opts.deep || [1.6, 1.9, 2.2, 2.5];
    var carryOpts = opts.carry || [0, 0.05];
    var backOpts = opts.back || [0.5, 1.0, 1.5, 2.2, 3.0];
    var runs = opts.runs || 24;
    var out = [];
    var origDeep = TUNE.layerOxygenMult[3], origCarry = TUNE.carryPenalty;
    for (var a = 0; a < deepOpts.length; a++) {
      for (var b = 0; b < carryOpts.length; b++) {
        LAYERS[3].oxygenMult = deepOpts[a];
        TUNE.layerOxygenMult[3] = deepOpts[a];
        TUNE.carryPenalty = carryOpts[b];
        var cells = [];
        for (var c = 0; c < backOpts.length; c++) {
          var rr = window.__runMany({
            runs: runs,
            policy: { targetLayer: 3, turnBackAt: backOpts[c], minSlack: Math.max(0.4, backOpts[c] * 2.0), grabRadius: 1.0 },
            seed: 4000
          });
          cells.push({
            back: backOpts[c],
            death: rr.deathRate,
            value: rr.avgBanked,
            ev: Math.round(rr.avgBanked * (1 - rr.deathRate / 100) * 10) / 10,
            ep: rr.avgEpisodesWithTarget,
            inBand: rr.grabInBandPerRun,
            lowOxy: rr.lowOxygenGrabShare,
            deep: rr.avgGrabsByLayer[3],
            causes: rr.deathCause
          });
        }
        var bestI = 0;
        for (var q = 1; q < cells.length; q++) if (cells[q].ev > cells[bestI].ev) bestI = q;
        out.push({
          deepMult: deepOpts[a], carry: carryOpts[b],
          cells: cells,
          bestBack: cells[bestI].back,
          bestEv: cells[bestI].ev,
          interiorPeak: bestI > 0 && bestI < cells.length - 1,
          greedPenalty: Math.round((cells[0].death - cells[bestI].death) * 10) / 10,
          deepUnreachable: 12 - Math.round(cells[bestI].deep)
        });
      }
    }
    LAYERS[3].oxygenMult = origDeep;
    TUNE.layerOxygenMult[3] = origDeep;
    TUNE.carryPenalty = origCarry;
    return out;
  };

  window.__selfTest = function () {
    var problems = [];
    function ok(cond, msg) { if (!cond) problems.push(msg); }

    ok(typeof window.__diveState === 'function', '缺少 __diveState');
    ok(typeof window.__autoplay === 'function', '缺少 __autoplay');
    ok(!!LAY, '布局未初始化');

    // 按钮不越界（竖屏 + 横屏都能按到）
    var rects = [LAY.collect, LAY.up, LAY.down];
    for (var i = 0; i < rects.length; i++) {
      var r = rects[i];
      ok(r.x - r.r >= 0 && r.x + r.r <= VW, '按钮横向越界');
      ok(r.y - r.r >= 0 && r.y + r.r <= VH, '按钮纵向越界');
    }
    // 按钮之间不重叠（手指不会误按）
    var pairs = [[LAY.collect, LAY.up], [LAY.up, LAY.down], [LAY.collect, LAY.down]];
    for (var j = 0; j < pairs.length; j++) {
      var d = Math.hypot(pairs[j][0].x - pairs[j][1].x, pairs[j][0].y - pairs[j][1].y);
      ok(d > pairs[j][0].r + pairs[j][1].r - 2, '按钮重叠（间距 ' + Math.round(d) + '）');
    }
    // 采样一次状态
    var state = window.__diveState();
    ['phase', 'oxygen', 'oxygenMax', 'depth', 'collected', 'totalValue', 'danger'].forEach(function (k) {
      ok(Object.prototype.hasOwnProperty.call(state, k), '__diveState 缺少字段 ' + k);
    });

    // 完整跑一局
    var run = window.__autoplayRun();
    ok(run.elapsed > 5, '一局时长过短（' + run.elapsed + 's）');
    ok(typeof run.total === 'number', '一局没有产出 total');

    // 连续多点触控（模拟两根手指）：摇杆 + 按钮互不干扰
    var fake = [];
    for (var k = 0; k < 3; k++) {
      var e = { pointerId: 100 + k, clientX: 40 + k * 6, clientY: VH - 120, preventDefault: function () {}, stopPropagation: function () {} };
      fake.push(e);
    }
    // 直接验证 pointerId 记账逻辑
    stick = { id: 501, ox: 40, oy: 300, x: 80, y: 300 };
    btnPointer = { collect: 502 };
    var v = stickVector();
    ok(Math.abs(v.x) > 0.2, '摇杆未产生水平输入');
    stick = null; btnPointer = {};

    return { ok: problems.length === 0, problems: problems, sample: state, run: run,
      layout: { VW: VW, VH: VH, portrait: LAY.portrait } };
  };

  /* 切换输入模式（topdown / free3d）
   * ⚠ free3d 不是为了做 3D 画面，而是把"必须同时维持第二个连续输入通道"
   *   这个成本建模进来，用来量化 R7 中 3D 方案的输入负担。 */
  window.__diveMode = function (m) {
    S.mode = (m === 'free3d') ? 'free3d' : 'topdown';
    refreshButtons();
    return S.mode;
  };

  /* 供外部调参 */
  window.__tune = TUNE;
  window.__dive = { state: S, layers: LAYERS };
  /* 摇杆/键盘的当前输入向量，供触屏自检读取（不必等物理帧才生效） */
  window.__diveStick = function () { return stickVector(); };

  /* ===========================================================================
   * 十四、启动
   * ========================================================================== */
  window.addEventListener('resize', function () {
    resize();
    render();
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { resize(); render(); }, 120);
  });

  resize();
  showButtons(false);
  S.rand = makeRng(Date.now() % 100000);

  /* 触屏交互验证：?touchtest=1
   * 用真实的 PointerEvent 派发，验证「摇杆按 pointerId 跟踪 + 按钮不穿透」，
   * 这是任务书里点名的验收条款，不能只靠读代码声称做到了。 */
  function runTouchTest() {
    var results = [];
    function log(name, obj) { results.push({ test: name, result: obj }); }
    function ev(kind, el, id, x, y) {
      el.dispatchEvent(new PointerEvent(kind, {
        pointerId: id, clientX: x, clientY: y,
        bubbles: true, cancelable: true, pointerType: 'touch'
      }));
    }

    var cvEl = document.querySelector('canvas');
    var btnGrab = document.getElementById('btnGrab');

    log('setup', {
      hasCanvas: !!cvEl,
      hasGrabButton: !!btnGrab,
      pointerEventsSupported: (typeof PointerEvent === 'function'),
      phase: window.__diveState().phase
    });

    // 开局（标题页点一下即开始）
    ev('pointerdown', cvEl, 1, 100, 400);
    ev('pointerup', cvEl, 1, 100, 400);
    log('start-run', { phase: window.__diveState().phase });

    // 测试 1：摇杆按 pointerId 跟踪，别的指头不能干扰
    var H = window.__dive.state.hero;
    ev('pointerdown', cvEl, 11, 100, 600);
    ev('pointermove', cvEl, 11, 170, 600);
    // 摇杆是在下一帧才转成速度的，所以直接查摇杆向量（同一 tick 内即可读到）
    var stickNow = window.__diveStick ? window.__diveStick() : null;
    var vxFinger1 = H.vx;
    ev('pointermove', cvEl, 77, 300, 300);          // 另一根指头乱动
    var vxOtherFinger = H.vx;
    log('test1-pointerId-tracking', {
      stickVector: stickNow,
      vxInitially: Math.round(vxFinger1),
      vxAfterOtherFinger: Math.round(vxOtherFinger),
      otherFingerIgnored: Math.abs(vxOtherFinger - vxFinger1) < 12,
      pass: stickNow !== null && Math.abs(stickNow.x) > 0.3
    });

    // 测试 2：第二根手指按采集按钮，摇杆不能断
    var stickBeforeBtn = window.__diveStick ? window.__diveStick() : { x: 0, y: 0, mag: 0 };
    ev('pointerdown', btnGrab, 22, 330, 780);
    var stickAfterBtn = window.__diveStick ? window.__diveStick() : { x: 0, y: 0, mag: 0 };
    log('test2-two-fingers', {
      stickBeforeButton: stickBeforeBtn,
      stickAfterButton: stickAfterBtn,
      joystickSurvivedButtonPress: Math.abs(stickAfterBtn.x - stickBeforeBtn.x) < 0.05,
      grabButtonPressed: btnGrab.classList.contains('down'),
      pass: Math.abs(stickAfterBtn.x - stickBeforeBtn.x) < 0.05
    });

    // 测试 3：按钮事件不穿透到 canvas（stopPropagation 生效）
    var canvasGot = false;
    var spy = function () { canvasGot = true; };
    cvEl.addEventListener('pointerdown', spy, true);
    ev('pointerdown', btnGrab, 23, 330, 780);
    cvEl.removeEventListener('pointerdown', spy, true);
    log('test3-stopPropagation', {
      canvasReceivedButtonPointerdown: canvasGot,
      pass: canvasGot === false
    });

    // 测试 4：按钮抬起后视觉回弹
    ev('pointerup', btnGrab, 23, 330, 780);
    log('test4-button-release', {
      downClassAfterUp: btnGrab.classList.contains('down'),
      pass: btnGrab.classList.contains('down') === false
    });

    // 测试 5：键盘可用（桌面调试路径）
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
    var kStick = window.__diveStick ? window.__diveStick() : null;
    window.dispatchEvent(new KeyboardEvent('keyup', { key: 'ArrowRight', bubbles: true }));
    log('test5-keyboard', {
      stickFromKeyboard: kStick,
      pass: kStick !== null && kStick.x > 0.3
    });

    // 测试 6：按钮互不重叠 + 不越界（误触防护）—— 复用 __selfTest 的断言
    var st = window.__selfTest();
    log('test6-layout', { selfTestOk: st.ok, problems: st.problems, layout: st.layout });

    // 测试 7：抬指后摇杆清空
    ev('pointerup', cvEl, 11, 170, 600);
    log('test7-release', { released: true });

    var pre = document.createElement('pre');
    pre.id = 'touch-out';
    pre.textContent = JSON.stringify({ touchTests: results }, null, 1);
    pre.style.cssText = 'position:fixed;inset:0;overflow:auto;font:11px/1.4 monospace;color:#cfe;background:#02101a;margin:0;padding:8px;z-index:99';
    document.body.appendChild(pre);
    var allPass = true;
    for (var i = 0; i < results.length; i++) {
      if (results[i].result && results[i].result.pass === false) allPass = false;
    }
    document.title = 'TOUCHTEST_' + (allPass ? 'PASS' : 'FAIL');
  }

  var shotName = readShotParam();
  if (shotName) setupShot(shotName);
  if (hasParam('selftest')) {
    // 等一帧，确保布局与首帧渲染完成后再跑（避免 LAY 还没算）
    setTimeout(runSelfTestPage, 60);
  }
  if (hasParam('touchtest')) {
    /* 注意：不要用 setTimeout 延迟。--dump-dom 的虚拟时间下定时器不一定被触发，
       实测会 dump 到一张还没跑测试的页面。这里同步跑完，只依赖已完成的 resize()。 */
    try { runTouchTest(); } catch (e) {
      var pre = document.createElement('pre');
      pre.id = 'touch-out';
      pre.textContent = JSON.stringify({ error: e.message, stack: String(e.stack || '') }, null, 1);
      document.body.appendChild(pre);
      document.title = 'TOUCHTEST_FAIL';
    }
  }

  requestAnimationFrame(frame);

  // 切回标签页时重置时间基线，避免 dt 爆炸
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) lastT = 0;
  });

})();
</script>
</body>
